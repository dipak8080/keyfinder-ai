name: Deploy to VPS

on:
  push:
    branches:
      - main

# Two pushes used to run two deploys at once on the same VPS, racing on
# the build and the container swap. Queue them instead, never cancel.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd ~/app

            # Always make VPS match GitHub exactly
            git fetch origin
            git reset --hard origin/main

            # Free space BEFORE building (prevents "no space left on device")
            echo "Cleaning Docker before build..."
            docker system prune -af --volumes || true
            docker builder prune -af || true

            # Internal network for audioforges-api <-> midi-worker traffic.
            # Idempotent: docker network create fails non-zero if it already
            # exists, so || true makes repeat deploys safe. No host port is
            # ever published for midi-worker - it's reachable ONLY from
            # containers on this network, never from the public internet.
            echo "Ensuring internal Docker network exists..."
            docker network create audioforges-net || true

            # ============================================================
            # WHISPER BUILD ARGS - read from .env so the model BAKED into
            # the image always matches the model the container is RUN with.
            #
            # These are two different mechanisms that used to be able to
            # disagree: the Dockerfile hardcoded 'small' at build time while
            # WHISPER_MODEL_SIZE was configurable at runtime. Setting a
            # different size in .env therefore produced an image without
            # those weights, so the container downloaded them at STARTUP -
            # blowing past the health-check window below and triggering a
            # rollback for what was only a slow first boot.
            #
            # Reading .env here means changing the model is a one-line .env
            # edit plus a redeploy, and the two can never drift.
            # ============================================================
            _read_env() {
              # $1 = key, $2 = default. Tolerates quotes, inline spaces and
              # commented-out lines.
              local v
              v=$(grep -E "^[[:space:]]*$1[[:space:]]*=" .env 2>/dev/null \
                  | tail -n1 | cut -d= -f2- | tr -d "\"'" | xargs || true)
              echo "${v:-$2}"
            }

            WHISPER_MODEL_SIZE=$(_read_env WHISPER_MODEL_SIZE small)
            WHISPER_COMPUTE_TYPE=$(_read_env WHISPER_COMPUTE_TYPE int8)
            # The local model is only loaded with TRANSCRIPTION_BACKEND=local,
            # so only then is it worth baking into the image (~480MB).
            TRANSCRIPTION_BACKEND=$(_read_env TRANSCRIPTION_BACKEND local | tr 'A-Z' 'a-z')
            if [ "$TRANSCRIPTION_BACKEND" = gpu ]; then BAKE_WHISPER_MODEL=0; else BAKE_WHISPER_MODEL=1; fi
            echo "Whisper build args: model=$WHISPER_MODEL_SIZE compute_type=$WHISPER_COMPUTE_TYPE bake=$BAKE_WHISPER_MODEL (backend=$TRANSCRIPTION_BACKEND)"

            # ============================================================
            # MIDI-WORKER (isolated sidecar) - built and deployed FIRST,
            # and DELIBERATELY NON-FATAL to this whole workflow.
            #
            # Rationale: midi-worker is dependency-isolated on purpose (see
            # audio_to_midi.py's module docstring) specifically so it can
            # never break the main product. That isolation should extend to
            # deploy time too - if TensorFlow fails to build, or the model
            # fails to load, that must degrade ONLY the /audio-to-midi
            # feature, not roll back or block deployment of every other
            # tool. Every step below is wrapped so a failure here logs
            # loudly and falls through, rather than tripping `set -e` and
            # aborting the whole deploy.
            # ============================================================
            # Skip entirely when midi-worker/ is unchanged since the last
            # healthy deploy: no rebuild, and no /audio-to-midi downtime.
            MIDI_TREE=$(git rev-parse HEAD:midi-worker 2>/dev/null || echo none)
            MIDI_STAMP=/home/deploy/app/data/.midi_worker_tree
            if [ "$MIDI_TREE" = "$(cat "$MIDI_STAMP" 2>/dev/null)" ] \
               && [ "$(docker inspect -f '{{.State.Running}}' midi-worker 2>/dev/null)" = "true" ]; then
              echo "midi-worker unchanged and running - skipping rebuild."
            else
            echo "Building midi-worker..."
            if docker build -t midi-worker:latest ./midi-worker; then
              docker stop midi-worker 2>/dev/null || true
              docker rm midi-worker 2>/dev/null || true

              docker run -d \
                --name midi-worker \
                --restart unless-stopped \
                --network audioforges-net \
                -e MIDI_WORKER_SHARED_SECRET="${{ secrets.MIDI_WORKER_SHARED_SECRET }}" \
                midi-worker:latest || echo "WARNING: midi-worker failed to start - /audio-to-midi will be unavailable until this is fixed manually."

              echo "Waiting for midi-worker to become healthy..."
              MIDI_HEALTHY=false
              for i in 1 2 3 4 5 6; do
                sleep 10
                if docker exec midi-worker python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)" 2>/dev/null; then
                  echo "midi-worker health check passed."
                  echo "$MIDI_TREE" > "$MIDI_STAMP"
                  MIDI_HEALTHY=true
                  break
                fi
                echo "midi-worker health check attempt $i failed, retrying..."
              done

              if [ "$MIDI_HEALTHY" = false ]; then
                echo "WARNING: midi-worker did not become healthy after retries. Logs:"
                docker logs midi-worker --tail 50 || true
                echo "Continuing with main app deploy anyway - /audio-to-midi will be degraded until this is investigated."
              fi
            else
              echo "WARNING: midi-worker image failed to build. /audio-to-midi will be unavailable until this is fixed manually. Continuing with main app deploy."
            fi
            fi

            # ============================================================
            # MAIN APP - BLUE/GREEN (2026-09-11)
            #
            # Two slots behind nginx: a = 127.0.0.1:8000, b = 127.0.0.1:8002.
            # The new image starts on the idle slot, is health-checked, then
            # nginx switches with a graceful reload via af-switch (the one
            # sudo rule the deploy user has). The old container keeps serving
            # its own jobs - job ids carry the slot letter and nginx routes
            # them back to it - and deploy/drain_old.sh stops it once idle.
            #
            # A failed health check only removes the new container. The old
            # one never stopped, so there is nothing to roll back and users
            # never see an outage.
            # ============================================================
            ACTIVE=$(grep -o 'af_slot_[ab]' /etc/nginx/conf.d/audioforges-active.conf 2>/dev/null | head -1 | cut -d_ -f3)
            ACTIVE=${ACTIVE:-a}
            if [ "$ACTIVE" = a ]; then ACTIVE_PORT=8000; NEW=b; NEW_PORT=8002; else ACTIVE_PORT=8002; NEW=a; NEW_PORT=8000; fi
            echo "Active slot: $ACTIVE (port $ACTIVE_PORT). Deploying to slot $NEW (port $NEW_PORT)."

            LIVE_PORT=$(docker port audioforges-api 8000/tcp 2>/dev/null | head -1 | awk -F: '{print $NF}')
            if [ -n "$LIVE_PORT" ] && [ "$LIVE_PORT" != "$ACTIVE_PORT" ]; then
              echo "ABORT: audioforges-api is on port $LIVE_PORT but nginx says slot $ACTIVE ($ACTIVE_PORT)."
              echo "Was it restarted by hand? Fix with: sudo af-switch <slot matching port $LIVE_PORT>. Site untouched."
              exit 1
            fi

            # A container still draining from the previous deploy sits on the
            # slot we are about to use. Give its jobs up to 10 minutes.
            if docker inspect audioforges-api-old >/dev/null 2>&1; then
              echo "Previous slot still draining - waiting up to 10 min for its jobs..."
              for i in $(seq 1 40); do
                docker inspect audioforges-api-old >/dev/null 2>&1 || break
                n=$(curl -s -m 5 "http://127.0.0.1:$NEW_PORT/internal/drain-status" \
                    | python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("processing", 0)))' 2>/dev/null || echo 0)
                [ "$n" -eq 0 ] && break
                sleep 15
              done
              docker rm -f audioforges-api-old >/dev/null 2>&1 || true
            fi
            docker rm -f audioforges-api-next >/dev/null 2>&1 || true

            # Built while the live container keeps serving.
            docker build \
              --build-arg WHISPER_MODEL_SIZE="$WHISPER_MODEL_SIZE" \
              --build-arg WHISPER_COMPUTE_TYPE="$WHISPER_COMPUTE_TYPE" \
              --build-arg BAKE_WHISPER_MODEL="$BAKE_WHISPER_MODEL" \
              -t audioforges-api:latest .

            # Two containers must fit under the shared Docker memory cap
            # (~5.7 GiB on this LXC). Wait for headroom rather than risk the
            # OOM killer taking the live container.
            to_mib() { awk '{v=$1; u=$1; gsub(/[0-9.]/,"",u); gsub(/[A-Za-z]/,"",v); if(u=="GiB")v*=1024; else if(u=="KiB")v/=1024; else if(u=="B")v/=1048576; s+=v} END{printf "%d", s}'; }
            LIMIT_MIB=$(docker stats --no-stream --format '{{.MemUsage}}' audioforges-api 2>/dev/null | awk '{print $3}' | to_mib)
            if [ "${LIMIT_MIB:-0}" -gt 0 ]; then
              for i in $(seq 1 20); do
                USED_MIB=$(docker stats --no-stream --format '{{.MemUsage}}' | to_mib)
                [ $((LIMIT_MIB - USED_MIB)) -ge 1536 ] && break
                echo "Memory tight (${USED_MIB}/${LIMIT_MIB} MiB) - waiting for headroom ($i/20)..."
                sleep 15
              done
              if [ $((LIMIT_MIB - USED_MIB)) -lt 1536 ]; then
                echo "ABORT: not enough memory for a second container. Site untouched - re-run this deploy when load drops."
                exit 1
              fi
            fi

            # PORT BINDING (2026-08-17): 127.0.0.1 ONLY, never 0.0.0.0.
            # Docker's NAT rules run before ufw, so a plain "-p 8000:8000"
            # is reachable from the internet and bypasses Cloudflare.
            docker run -d \
              --name audioforges-api-next \
              --restart unless-stopped \
              --network audioforges-net \
              --env-file .env \
              -e PORT=8000 \
              -e INSTANCE_SLOT="$NEW" \
              -v /home/deploy/app/data:/app/data \
              -p 127.0.0.1:$NEW_PORT:8000 \
              audioforges-api:latest

            echo "Waiting for the new container to become healthy..."
            HEALTHY=false
            for i in 1 2 3 4 5 6 7 8 9; do
              sleep 10
              if curl -sf "http://127.0.0.1:$NEW_PORT/health" > /dev/null; then
                HEALTHY=true
                break
              fi
              echo "Health check attempt $i failed, retrying..."
            done

            if [ "$HEALTHY" = false ]; then
              echo "Health check FAILED. Logs from the new container:"
              docker logs audioforges-api-next --tail 100 || true
              docker rm -f audioforges-api-next || true
              echo "New container removed. Users stayed on slot $ACTIVE the whole time."
              exit 1
            fi
            echo "Health check passed."

            # Whisper survives a failed model load by design, so /health
            # stays green while /speech-to-text returns 503. Surface it here.
            if docker logs audioforges-api-next 2>&1 | grep -q "FAILED to load Whisper model"; then
              echo "WARNING: Whisper model failed to load - /speech-to-text will return 503."
              docker logs audioforges-api-next 2>&1 | grep -A5 "FAILED to load Whisper model" | tail -20 || true
            else
              docker logs audioforges-api-next 2>&1 | grep -E "Whisper model loaded successfully|VAD filter|language codes from faster_whisper" | tail -5 || true
            fi

            if ! sudo -n /usr/local/sbin/af-switch "$NEW"; then
              docker rm -f audioforges-api-next || true
              echo "ABORT: nginx switch failed. New container removed, site stays on slot $ACTIVE."
              exit 1
            fi

            # The live container is always named audioforges-api, so the
            # canary, cheatsheet and handoff commands keep working.
            OLD_ID=$(docker inspect -f '{{.Id}}' audioforges-api 2>/dev/null || true)
            if [ -n "$OLD_ID" ]; then
              docker rename audioforges-api audioforges-api-old
            fi
            docker rename audioforges-api-next audioforges-api

            if [ -n "$OLD_ID" ]; then
              DRAIN=/tmp/af-drain-${OLD_ID:0:12}.sh
              cp deploy/drain_old.sh "$DRAIN"
              setsid nohup bash "$DRAIN" "$OLD_ID" "$ACTIVE_PORT" >> /home/deploy/app/data/drain.log 2>&1 < /dev/null &
              echo "Old container draining in the background (data/drain.log)."
            fi

            docker image prune -f
            docker builder prune -af
            echo "Deploy successful - live on slot $NEW."
            exit 0