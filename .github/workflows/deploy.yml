name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd ~/app

            # Always make VPS match GitHub exactly
            git fetch origin
            git reset --hard origin/main

            # Free space BEFORE building (prevents "no space left on device")
            echo "Cleaning Docker before build..."
            docker system prune -af --volumes || true
            docker builder prune -af || true

            # Internal network for audioforges-api <-> midi-worker traffic.
            # Idempotent: docker network create fails non-zero if it already
            # exists, so || true makes repeat deploys safe. No host port is
            # ever published for midi-worker - it's reachable ONLY from
            # containers on this network, never from the public internet.
            echo "Ensuring internal Docker network exists..."
            docker network create audioforges-net || true

            # ============================================================
            # WHISPER BUILD ARGS - read from .env so the model BAKED into
            # the image always matches the model the container is RUN with.
            #
            # These are two different mechanisms that used to be able to
            # disagree: the Dockerfile hardcoded 'small' at build time while
            # WHISPER_MODEL_SIZE was configurable at runtime. Setting a
            # different size in .env therefore produced an image without
            # those weights, so the container downloaded them at STARTUP -
            # blowing past the health-check window below and triggering a
            # rollback for what was only a slow first boot.
            #
            # Reading .env here means changing the model is a one-line .env
            # edit plus a redeploy, and the two can never drift.
            # ============================================================
            _read_env() {
              # $1 = key, $2 = default. Tolerates quotes, inline spaces and
              # commented-out lines.
              local v
              v=$(grep -E "^[[:space:]]*$1[[:space:]]*=" .env 2>/dev/null \
                  | tail -n1 | cut -d= -f2- | tr -d "\"'" | xargs || true)
              echo "${v:-$2}"
            }

            WHISPER_MODEL_SIZE=$(_read_env WHISPER_MODEL_SIZE small)
            WHISPER_COMPUTE_TYPE=$(_read_env WHISPER_COMPUTE_TYPE int8)
            echo "Whisper build args: model=$WHISPER_MODEL_SIZE compute_type=$WHISPER_COMPUTE_TYPE"

            # ============================================================
            # MIDI-WORKER (isolated sidecar) - built and deployed FIRST,
            # and DELIBERATELY NON-FATAL to this whole workflow.
            #
            # Rationale: midi-worker is dependency-isolated on purpose (see
            # audio_to_midi.py's module docstring) specifically so it can
            # never break the main product. That isolation should extend to
            # deploy time too - if TensorFlow fails to build, or the model
            # fails to load, that must degrade ONLY the /audio-to-midi
            # feature, not roll back or block deployment of every other
            # tool. Every step below is wrapped so a failure here logs
            # loudly and falls through, rather than tripping `set -e` and
            # aborting the whole deploy.
            # ============================================================
            echo "Building midi-worker..."
            if docker build -t midi-worker:latest ./midi-worker; then
              docker stop midi-worker 2>/dev/null || true
              docker rm midi-worker 2>/dev/null || true

              docker run -d \
                --name midi-worker \
                --restart unless-stopped \
                --network audioforges-net \
                -e MIDI_WORKER_SHARED_SECRET="${{ secrets.MIDI_WORKER_SHARED_SECRET }}" \
                midi-worker:latest || echo "WARNING: midi-worker failed to start - /audio-to-midi will be unavailable until this is fixed manually."

              echo "Waiting for midi-worker to become healthy..."
              MIDI_HEALTHY=false
              for i in 1 2 3 4 5 6; do
                sleep 10
                if docker exec midi-worker python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)" 2>/dev/null; then
                  echo "midi-worker health check passed."
                  MIDI_HEALTHY=true
                  break
                fi
                echo "midi-worker health check attempt $i failed, retrying..."
              done

              if [ "$MIDI_HEALTHY" = false ]; then
                echo "WARNING: midi-worker did not become healthy after retries. Logs:"
                docker logs midi-worker --tail 50 || true
                echo "Continuing with main app deploy anyway - /audio-to-midi will be degraded until this is investigated."
              fi
            else
              echo "WARNING: midi-worker image failed to build. /audio-to-midi will be unavailable until this is fixed manually. Continuing with main app deploy."
            fi

            # ============================================================
            # MAIN APP - unchanged logic below, this is the deploy that
            # actually gates success/failure and rollback for this workflow.
            # ============================================================

            # Tag current container as rollback point (safe – won't abort if it fails)
            if docker inspect audioforges-api > /dev/null 2>&1; then
              if docker commit audioforges-api audioforges-api:rollback; then
                echo "Tagged current container as rollback point."
              else
                echo "Could not commit existing container (layers missing?) – removing it and continuing."
                docker rm -f audioforges-api || true
              fi
            else
              echo "No existing container found - skipping rollback tag."
            fi

            # Build latest image. The Whisper build args make the baked
            # model match .env - see the block above for why this matters.
            docker build \
              --build-arg WHISPER_MODEL_SIZE="$WHISPER_MODEL_SIZE" \
              --build-arg WHISPER_COMPUTE_TYPE="$WHISPER_COMPUTE_TYPE" \
              -t audioforges-api:latest .

            # Replace existing container
            docker stop audioforges-api || true
            docker rm audioforges-api || true

            # Start new container - now on audioforges-net so it can reach
            # midi-worker by container name.
            #
            # PORT BINDING (2026-08-17): published on 127.0.0.1 ONLY, never
            # 0.0.0.0. Docker writes its port publishing rules into iptables'
            # nat table, which is evaluated BEFORE ufw's INPUT filter - so a
            # plain "-p 8000:8000" is reachable from the public internet even
            # though ufw only allows 443/80 from Cloudflare ranges. That made
            # http://<vps-ip>:8000 a full bypass of Cloudflare: no WAF rules,
            # no rate limiting, no TLS, straight to the app. Binding to the
            # loopback address means only host-local processes can reach it,
            # which is exactly nginx (proxy_pass http://127.0.0.1:8000) and
            # the health checks below. If this ever reverts to "8000:8000",
            # the entire edge perimeter becomes decorative.
            docker run -d \
              --name audioforges-api \
              --restart unless-stopped \
              --network audioforges-net \
              --env-file .env \
              -e PORT=8000 \
              -v /home/deploy/app/data:/app/data \
              -p 127.0.0.1:8000:8000 \
              audioforges-api:latest

            # Wait longer + retry health check (model loading is slow)
            echo "Waiting for new container to become healthy..."
            for i in 1 2 3 4 5 6; do
              sleep 10
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "Health check passed - deploy successful."

                # ----------------------------------------------------
                # TRANSCRIPTION CHECK - non-fatal by design, same
                # philosophy as midi-worker above. speech_to_text.py
                # deliberately survives a failed model load so one bad
                # download degrades ONE endpoint instead of taking the
                # whole app down. The cost of that choice is that /health
                # stays green while /speech-to-text returns 503, so the
                # failure is otherwise invisible until a user hits it.
                # Surface it in the deploy log instead.
                # ----------------------------------------------------
                if docker logs audioforges-api 2>&1 | grep -q "FAILED to load Whisper model"; then
                  echo "WARNING: Whisper model failed to load - /speech-to-text will return 503."
                  echo "         Every other tool is unaffected. Relevant logs:"
                  docker logs audioforges-api 2>&1 | grep -A5 "FAILED to load Whisper model" | tail -20 || true
                else
                  docker logs audioforges-api 2>&1 | grep -E "Whisper model loaded successfully|VAD filter|language codes from faster_whisper" | tail -5 || true
                fi

                docker image prune -f
                docker builder prune -af
                echo "Cleaned up old images and build cache."
                exit 0
              fi
              echo "Health check attempt $i failed, retrying..."
            done

            # Still unhealthy → rollback
            echo "Health check FAILED after retries. Logs from the failed container:"
            docker logs audioforges-api --tail 100

            if docker inspect audioforges-api:rollback > /dev/null 2>&1; then
              echo "Rolling back to previous image..."
              docker stop audioforges-api || true
              docker rm audioforges-api || true

              docker run -d \
                --name audioforges-api \
                --restart unless-stopped \
                --network audioforges-net \
                --env-file .env \
                -e PORT=8000 \
                -v /home/deploy/app/data:/app/data \
                -p 127.0.0.1:8000:8000 \
                audioforges-api:rollback

              sleep 15
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "Rollback successful - previous version is running again."
              else
                echo "ROLLBACK ALSO FAILED - site is likely down. Manual intervention needed."
              fi
            else
              echo "No rollback image available - site is likely down. Manual intervention needed."
            fi

            exit 1