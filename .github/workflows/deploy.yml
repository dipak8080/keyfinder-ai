name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ~/app

            # Always make VPS match GitHub exactly
            git fetch origin
            git reset --hard origin/main

            # Build latest image
            docker build -t audioforges-api .

            # Replace existing container
            docker stop audioforges-api || true
            docker rm audioforges-api || true

            # Start new container
            docker run -d \
              --name audioforges-api \
              --restart unless-stopped \
              --env-file .env \
              -e PORT=8000 \
              -v /home/deploy/app/data:/app/data \
              -p 8000:8000 \
              audioforges-api

            # Clean old images
            docker image prune -f