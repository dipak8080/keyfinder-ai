name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/app
            git pull origin main
            docker build -t audioforges-api .
            docker stop audioforges-api || true
            docker rm audioforges-api || true
            docker run -d \
              --name audioforges-api \
              --restart unless-stopped \
              --env-file .env \
              -e PORT=8000 \
              -p 8000:8000 \
              audioforges-api
            docker image prune -f